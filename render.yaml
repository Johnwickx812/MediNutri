services:
  - type: web
    name: medinutri-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: medinutri-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FEEDBACK_RECEIVER
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.10
